name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
jobs:
  qodana-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }} 
          fetch-depth: 0
      - name: 'Qodana Backend'
        uses: JetBrains/qodana-action@main
        with:
          args: |
            --source-directory,java-part,--config,java-qodana.yaml,-l,jetbrains/qodana-jvm:2024.3
          post-pr-comment: 'true'
          upload-result: 'true'
          artifact-name: qodana-backend
        env:
            QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
  qodana-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }} 
          fetch-depth: 0
      - name: 'Qodana Frontend'
        uses: JetBrains/qodana-action@main
        with:
          args: |
            --source-directory,vite-typescript-part,--config,js-qodana.yaml,-l,jetbrains/qodana-js:2024.3
          post-pr-comment: 'true'
          upload-result: 'true'
          artifact-name: qodana-frontend
        env:
            QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
  qodana-second-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 'Qodana Backend'
        uses: JetBrains/qodana-action@main
        with:
          args: |
            --source-directory,java-second-part,--config,java-second-qodana.yaml,-l,jetbrains/qodana-jvm:2024.3
          post-pr-comment: 'true'
          upload-result: 'true'
          artifact-name: qodana-second-backend
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
  qodana-second-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 'Qodana Frontend'
        uses: JetBrains/qodana-action@main
        with:
          args: |
            --source-directory,html-part,--config,js-html-qodana.yaml,-l,jetbrains/qodana-js:2024.3
          post-pr-comment: 'true'
          upload-result: 'true'
          artifact-name: qodana-second-frontend
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
